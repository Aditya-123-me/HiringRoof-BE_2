name: Deploy HiringRoof Backend

on:
  push:
    branches:
      - anubhaw

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying Backend (anubhaw branch) to /var/www/html/hiringroof-backend..."
            cd /var/www/html/hiringroof-backend
            if [ -d ".git" ]; then
              git fetch origin
              git checkout anubhaw || git checkout -b anubhaw origin/anubhaw
              git pull origin anubhaw
            else
              echo "⚠️ /var/www/html/hiringroof-backend is not a git repo yet."
            fi
            npm install --omit=dev
            pm2 restart hiringroof-backend || pm2 start index.js --name "hiringroof-backend"
            pm2 save
            echo "✅ Backend Deployment Complete!"
